<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="icon.png">
  <title>岁安 · SuiAn</title>
  <meta name="description" content="岁安的个人网站 — 数据分析师 & AI 学习者">
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

  <!-- CRT 扫描线 -->
  <div class="crt-overlay"></div>

  <!-- 粒子背景 -->
  <canvas class="particles-canvas" id="particles"></canvas>
  <canvas class="floating-clawd-canvas" id="floatingClawd" aria-hidden="true"></canvas>

  <!-- 导航栏 -->
  <nav class="nav" data-studio-section="nav">
    <div class="nav-inner">
      <span class="nav-brand" data-edit-key="nav.brand" data-edit-label="站点名称" data-edit-section="nav" data-edit-source="◈ SUIAN ◈" data-edit-english-class="text-en-display" lang="en">◈ SUIAN ◈</span>
      <div class="nav-actions">
        <div class="nav-links" id="navLinks">
          <!-- JS 动态生成 -->
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero 区 -->
  <section class="hero" id="hero" data-studio-section="hero">
    <div class="hero-avatar" id="heroAvatar"></div>
    <h1 class="hero-title" id="heroTitle"></h1>
    <div class="hero-subtitle" id="heroSubtitle"></div>
    <div class="hero-divider"></div>
    <p class="hero-desc" id="heroDesc"></p>
    <div class="hero-scroll-hint" data-edit-key="hero.scrollHint" data-edit-label="下滑提示" data-edit-section="hero" data-edit-source="▼ 按下 ENTER 键 ▼">
      <span class="text-cn" lang="zh-CN">▼ 按下 </span>
      <span class="text-en-body" lang="en">ENTER</span>
      <span class="text-cn" lang="zh-CN"> 键 ▼</span>
    </div>
  </section>

  <!-- 关于我 -->
  <section class="section" id="about" data-studio-section="about">
    <h2 class="section-title">
      <span class="icon">📋</span><span class="text-en-display" lang="en" data-edit-key="about.heading" data-edit-label="模块标题" data-edit-section="about" data-edit-source=" ABOUT ME" data-edit-english-class="text-en-display"> ABOUT ME</span>
      <span class="bar"></span>
    </h2>
    <p class="section-subtitle" id="aboutIntro"></p>
    <div class="about-layout">
      <!-- 属性面板 -->
      <div class="about-card" id="statsPanel">
        <div class="about-card-title"><span class="about-card-icon" aria-hidden="true">⚔️</span><span lang="en" data-edit-key="about.statsHeading" data-edit-label="属性面板标题" data-edit-section="about" data-edit-source="CHARACTER STATS" data-edit-english-class="text-en-display">CHARACTER STATS</span></div>
        <div id="statsContainer"></div>
      </div>
      <!-- 技能槽 -->
      <div class="about-card" id="skillsPanel">
        <div class="about-card-title"><span class="about-card-icon" aria-hidden="true">🎒</span><span lang="en" data-edit-key="about.skillsHeading" data-edit-label="技能面板标题" data-edit-section="about" data-edit-source="SKILL SLOTS" data-edit-english-class="text-en-display">SKILL SLOTS</span></div>
        <div class="skill-slots" id="skillsContainer"></div>
      </div>
    </div>
  </section>

  <!-- 项目 -->
  <section class="section" id="projects" data-studio-section="projects">
    <h2 class="section-title">
      <span class="icon">📦</span><span class="text-en-display" lang="en" data-edit-key="projects.heading" data-edit-label="模块标题" data-edit-section="projects" data-edit-source=" PROJECTS" data-edit-english-class="text-en-display"> PROJECTS</span>
      <span class="bar"></span>
    </h2>
    <p class="section-subtitle text-mixed" data-edit-key="projects.subtitle" data-edit-label="模块副标题" data-edit-section="projects" data-edit-source="// QUEST LOG —任务日志">
      <span class="text-en-body" lang="en">// QUEST LOG —</span>
      <span class="text-cn" lang="zh-CN">任务日志</span>
    </p>
    <div class="projects-grid" id="projectsGrid"></div>
  </section>

  <!-- 简历 -->
  <section class="section" id="resume" data-studio-section="resume">
    <h2 class="section-title">
      <span class="icon">📜</span><span class="text-en-display" lang="en" data-edit-key="resume.heading" data-edit-label="模块标题" data-edit-section="resume" data-edit-source=" RESUME" data-edit-english-class="text-en-display"> RESUME</span>
      <span class="bar"></span>
    </h2>
    <p class="section-subtitle text-mixed" data-edit-key="resume.subtitle" data-edit-label="模块副标题" data-edit-section="resume" data-edit-source="// LEVEL PROGRESS —关卡进度">
      <span class="text-en-body" lang="en">// LEVEL PROGRESS —</span>
      <span class="text-cn" lang="zh-CN">关卡进度</span>
    </p>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- 终端 -->
  <section class="section" id="contact" data-studio-section="terminal">
    <h2 class="section-title">
      <span class="icon">💻</span><span class="text-en-display" lang="en" data-edit-key="terminal.heading" data-edit-label="模块标题" data-edit-section="terminal" data-edit-source=" TERMINAL" data-edit-english-class="text-en-display"> TERMINAL</span>
      <span class="bar"></span>
    </h2>
    <p class="section-subtitle text-mixed" data-edit-key="terminal.subtitle" data-edit-label="模块副标题" data-edit-section="terminal" data-edit-source="// CONTACT —建立连接">
      <span class="text-en-body" lang="en">// CONTACT —</span>
      <span class="text-cn" lang="zh-CN">建立连接</span>
    </p>
    <div class="terminal">
      <div class="terminal-header">
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-title" data-edit-key="terminal.title" data-edit-label="窗口标题" data-edit-section="terminal" data-edit-source="SuiAn@dev:~" data-edit-english-class="text-en-body">SuiAn@dev:~</span>
      </div>
      <div class="terminal-body" id="terminalBody">
        <div class="terminal-line terminal-command-line"><span class="output" id="terminalIntro"></span></div>
        <div class="terminal-line">&nbsp;</div>
      </div>
      <div class="terminal-footer">
        <span class="terminal-input-line terminal-command-line">
          <span class="prompt" style="color:var(--green);" data-edit-key="terminal.prompt" data-edit-label="命令提示符" data-edit-section="terminal" data-edit-source="SuiAn@dev:~$" data-edit-english-class="text-en-body">SuiAn@dev:~$</span>
          <input class="terminal-input" id="terminalInput" type="text"
                 data-edit-key="terminal.inputPlaceholder" data-edit-label="输入框提示" data-edit-section="terminal" data-edit-attribute="placeholder" data-edit-source="输入 help 查看可用命令..." data-edit-english-class="text-en-body"
                 placeholder="输入 help 查看可用命令...">
        </span>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" data-studio-section="footer">
    <div class="footer-gameover" data-edit-key="footer.gameover" data-edit-label="结束标题" data-edit-section="footer" data-edit-source="— GAME OVER —" data-edit-english-class="text-en-display">— GAME OVER —</div>
    <div class="footer-colors">
      <span class="footer-color"></span>
      <span class="footer-color"></span>
      <span class="footer-color"></span>
      <span class="footer-color"></span>
    </div>
    <p class="footer-text text-mixed" data-edit-key="footer.text" data-edit-label="版权说明" data-edit-section="footer" data-edit-source="© 2026岁安· Built with 8-bit love">
      <span class="text-en-body" lang="en">© 2026</span>
      <span class="text-cn" lang="zh-CN">岁安</span>
      <span class="text-en-body" lang="en">· Built with 8-bit love</span>
    </p>
  </footer>

  <script src="js/site-config.js"></script>
  <script src="data.js"></script>
  <script src="js/site-behaviors.js"></script>
  <script src="js/site-runtime.js"></script>
  <script src="js/floating-clawd.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
