<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="icon.png">
  <title>岁安 · SuiAn</title>
  <meta name="description" content="岁安的个人网站 — 数据分析师 & AI 学习者">
  <link rel="stylesheet" href="stylesheet.css">
</head>
<body>

  <!-- CRT 扫描线 -->
  <div class="crt-overlay"></div>

  <!-- 粒子背景 -->
  <canvas class="particles-canvas" id="particles"></canvas>

  <!-- 导航栏 -->
  <nav class="nav" data-studio-section="nav">
    <div class="nav-inner">
      <span class="nav-brand" data-edit-key="nav.brand">◈ SUIAN ◈</span>
      <div class="nav-actions">
        <div class="nav-links" id="navLinks">
          <!-- JS 动态生成 -->
        </div>
        <div class="font-scale-control" id="fontScaleControl">
          <button class="font-scale-toggle" id="fontScaleToggle" type="button"
                  aria-expanded="false" aria-controls="fontScalePanel"
                  aria-label="调整全站字体大小">
            <span aria-hidden="true">A</span>
            <span id="fontScaleButtonValue">100%</span>
          </button>
          <div class="font-scale-panel" id="fontScalePanel" hidden>
            <label class="font-scale-label" for="fontScaleRange">
              <span class="text-cn" lang="zh-CN">字体大小</span>
              <output id="fontScaleValue" for="fontScaleRange">100%</output>
            </label>
            <input class="font-scale-range" id="fontScaleRange" type="range"
                   min="90" max="130" step="5" value="100">
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero 区 -->
  <section class="hero" id="hero" data-studio-section="hero">
    <div class="hero-avatar" id="heroAvatar"></div>
    <h1 class="hero-title" id="heroTitle"></h1>
    <div class="hero-subtitle" id="heroSubtitle"></div>
    <div class="hero-divider"></div>
    <p class="hero-desc" id="heroDesc"></p>
    <div class="hero-scroll-hint">
      <span class="text-cn" lang="zh-CN">▼ 按下 </span>
      <span class="text-en-body" lang="en">ENTER</span>
      <span class="text-cn" lang="zh-CN"> 键 ▼</span>
    </div>
  </section>

  <!-- 关于我 -->
  <section class="section" id="about" data-studio-section="about">
    <h2 class="section-title">
      <span class="icon">📋</span><span data-edit-key="about.heading"> ABOUT ME</span>
      <span class="bar"></span>
    </h2>
    <p class="section-subtitle" id="aboutIntro"></p>
    <div class="about-layout">
      <!-- 属性面板 -->
      <div class="about-card" id="statsPanel">
        <div class="about-card-title"><span class="about-card-icon" aria-hidden="true">⚔️</span><span lang="en">CHARACTER STATS</span></div>
        <div id="statsContainer"></div>
      </div>
      <!-- 技能槽 -->
      <div class="about-card" id="skillsPanel">
        <div class="about-card-title"><span class="about-card-icon" aria-hidden="true">🎒</span><span lang="en">SKILL SLOTS</span></div>
        <div class="skill-slots" id="skillsContainer"></div>
      </div>
    </div>
  </section>

  <!-- 项目 -->
  <section class="section" id="projects" data-studio-section="projects">
    <h2 class="section-title">
      <span class="icon">📦</span><span data-edit-key="projects.heading"> PROJECTS</span>
      <span class="bar"></span>
    </h2>
    <p class="section-subtitle text-mixed" data-edit-key="projects.subtitle">
      <span class="text-en-body" lang="en">// QUEST LOG —</span>
      <span class="text-cn" lang="zh-CN">任务日志</span>
    </p>
    <div class="projects-grid" id="projectsGrid"></div>
  </section>

  <!-- 简历 -->
  <section class="section" id="resume" data-studio-section="resume">
    <h2 class="section-title">
      <span class="icon">📜</span><span data-edit-key="resume.heading"> RESUME</span>
      <span class="bar"></span>
    </h2>
    <p class="section-subtitle text-mixed" data-edit-key="resume.subtitle">
      <span class="text-en-body" lang="en">// LEVEL PROGRESS —</span>
      <span class="text-cn" lang="zh-CN">关卡进度</span>
    </p>
    <div class="timeline" id="timeline"></div>
  </section>

  <!-- 终端 -->
  <section class="section" id="contact" data-studio-section="terminal">
    <h2 class="section-title">
      <span class="icon">💻</span><span data-edit-key="terminal.heading"> TERMINAL</span>
      <span class="bar"></span>
    </h2>
    <p class="section-subtitle text-mixed" data-edit-key="terminal.subtitle">
      <span class="text-en-body" lang="en">// CONTACT —</span>
      <span class="text-cn" lang="zh-CN">建立连接</span>
    </p>
    <div class="terminal">
      <div class="terminal-header">
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-dot"></span>
        <span class="terminal-title" data-edit-key="terminal.title">SuiAn@dev:~</span>
      </div>
      <div class="terminal-body" id="terminalBody">
        <div class="terminal-line"><span class="output" id="terminalIntro"></span></div>
        <div class="terminal-line">&nbsp;</div>
      </div>
      <div class="terminal-footer">
        <span class="terminal-input-line">
          <span class="prompt" style="color:var(--green);" data-edit-key="terminal.prompt">SuiAn@dev:~$</span>
          <input class="terminal-input" id="terminalInput" type="text"
                 data-edit-key="terminal.inputPlaceholder" data-edit-attribute="placeholder"
                 placeholder="输入 help 查看可用命令...">
        </span>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer" data-studio-section="footer">
    <div class="footer-gameover" data-edit-key="footer.gameover">— GAME OVER —</div>
    <div class="footer-colors">
      <span class="footer-color"></span>
      <span class="footer-color"></span>
      <span class="footer-color"></span>
      <span class="footer-color"></span>
    </div>
    <p class="footer-text text-mixed" data-edit-key="footer.text">
      <span class="text-en-body" lang="en">© 2026</span>
      <span class="text-cn" lang="zh-CN">岁安</span>
      <span class="text-en-body" lang="en">· Built with 8-bit love</span>
    </p>
  </footer>

  <button class="site-studio-toggle" id="siteStudioToggle" type="button"
          aria-expanded="false" aria-controls="siteStudioPanel">
    <span aria-hidden="true">✎</span><span class="text-cn" lang="zh-CN">编辑网站</span>
  </button>

  <aside class="site-studio-panel" id="siteStudioPanel" hidden aria-label="网站排版与文案编辑">
    <div class="site-studio-header">
      <span class="text-cn" lang="zh-CN">排版与文案</span>
      <button class="site-studio-close" id="siteStudioClose" type="button" aria-label="关闭编辑网站">×</button>
    </div>
    <label class="site-studio-edit-mode" for="siteStudioEditMode">
      <input id="siteStudioEditMode" type="checkbox">
      <span class="text-cn" lang="zh-CN">原地编辑文案</span>
    </label>
    <div class="site-studio-sections">
      <details class="site-studio-section-control" data-studio-control="nav"><summary>导航</summary><label>字体<select data-studio-font-control><option value="classic">经典像素</option><option value="terminal">清晰终端</option><option value="arcade">硬核街机</option><option value="code">代码等宽</option></select></label><label>字号 <output data-studio-scale-value>100%</output><input data-studio-scale-control type="range" min="80" max="140" step="5" value="100"></label><button type="button" data-studio-reset-section>恢复默认</button></details>
      <details class="site-studio-section-control" data-studio-control="hero"><summary>Hero</summary><label>字体<select data-studio-font-control><option value="classic">经典像素</option><option value="terminal">清晰终端</option><option value="arcade">硬核街机</option><option value="code">代码等宽</option></select></label><label>字号 <output data-studio-scale-value>100%</output><input data-studio-scale-control type="range" min="80" max="140" step="5" value="100"></label><button type="button" data-studio-reset-section>恢复默认</button></details>
      <details class="site-studio-section-control" data-studio-control="about"><summary>About</summary><label>字体<select data-studio-font-control><option value="classic">经典像素</option><option value="terminal">清晰终端</option><option value="arcade">硬核街机</option><option value="code">代码等宽</option></select></label><label>字号 <output data-studio-scale-value>100%</output><input data-studio-scale-control type="range" min="80" max="140" step="5" value="100"></label><button type="button" data-studio-reset-section>恢复默认</button></details>
      <details class="site-studio-section-control" data-studio-control="projects"><summary>Projects</summary><label>字体<select data-studio-font-control><option value="classic">经典像素</option><option value="terminal">清晰终端</option><option value="arcade">硬核街机</option><option value="code">代码等宽</option></select></label><label>字号 <output data-studio-scale-value>100%</output><input data-studio-scale-control type="range" min="80" max="140" step="5" value="100"></label><button type="button" data-studio-reset-section>恢复默认</button></details>
      <details class="site-studio-section-control" data-studio-control="resume"><summary>Resume</summary><label>字体<select data-studio-font-control><option value="classic">经典像素</option><option value="terminal">清晰终端</option><option value="arcade">硬核街机</option><option value="code">代码等宽</option></select></label><label>字号 <output data-studio-scale-value>100%</output><input data-studio-scale-control type="range" min="80" max="140" step="5" value="100"></label><button type="button" data-studio-reset-section>恢复默认</button></details>
      <details class="site-studio-section-control" data-studio-control="terminal"><summary>Terminal</summary><label>字体<select data-studio-font-control><option value="classic">经典像素</option><option value="terminal">清晰终端</option><option value="arcade">硬核街机</option><option value="code">代码等宽</option></select></label><label>字号 <output data-studio-scale-value>100%</output><input data-studio-scale-control type="range" min="80" max="140" step="5" value="100"></label><button type="button" data-studio-reset-section>恢复默认</button></details>
      <details class="site-studio-section-control" data-studio-control="footer"><summary>页脚</summary><label>字体<select data-studio-font-control><option value="classic">经典像素</option><option value="terminal">清晰终端</option><option value="arcade">硬核街机</option><option value="code">代码等宽</option></select></label><label>字号 <output data-studio-scale-value>100%</output><input data-studio-scale-control type="range" min="80" max="140" step="5" value="100"></label><button type="button" data-studio-reset-section>恢复默认</button></details>
    </div>
    <button class="site-studio-reset-all" id="siteStudioResetAll" type="button">恢复全部默认值</button>
  </aside>

  <script src="data.js"></script>
  <script src="js/font-scale.js"></script>
  <script src="js/site-behaviors.js"></script>
  <script src="js/script.js"></script>
  <script src="js/site-studio.js"></script>
</body>
</html>
